name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extraire le projet Android
        run: |
          mkdir projet
          unzip -q ./*.zip -d projet

      - name: Construire l'APK
        working-directory: projet
        run: gradle assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Quincaillerie-debug-apk
          path: projet/app/build/outputs/apk/debug/app-debug.apk
